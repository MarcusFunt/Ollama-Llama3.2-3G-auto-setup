name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  docs-and-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            README.md
            CONTRIBUTING.md
      - name: Check markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: "yes"
          config-file: .github/markdown-link-check-config.json
          file-path: README.md,CONTRIBUTING.md

  shell-and-env:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: .
      - name: Install shfmt
        run: sudo apt-get update && sudo apt-get install -y shfmt
      - name: Check shell formatting
        run: shfmt -d -i 2 -ci install.sh
      - name: Install dotenv-linter
        run: |
          wget -qO- https://github.com/dotenv-linter/dotenv-linter/releases/latest/download/dotenv-linter-linux-x86_64.tar.gz \
            | tar xz dotenv-linter
          sudo mv dotenv-linter /usr/local/bin/dotenv-linter
      - name: Lint .env.example
        run: dotenv-linter .env.example
      - name: Validate documented env variables
        run: python3 scripts/check-env-vars.py

  compose-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yamllint
        run: pipx install yamllint
      - name: Lint compose yaml
        run: yamllint docker-compose.yml
      - name: Validate compose config
        run: docker compose config >/dev/null

  installer-smoke-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run installer in CPU mode
        env:
          GPU_COUNT: "0"
          OLLAMA_MODEL: llama3.2:1b
        run: ./install.sh
      - name: Verify ollama container is running
        run: docker compose ps
      - name: Re-run installer (idempotency)
        env:
          GPU_COUNT: "0"
          OLLAMA_MODEL: llama3.2:1b
        run: ./install.sh
      - name: Cleanup
        if: always()
        run: docker compose down -v
