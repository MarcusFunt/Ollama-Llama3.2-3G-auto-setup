name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  docs-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install lint tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt yamllint cargo
          cargo install dotenv-linter --locked
          npm install --global markdownlint-cli@0.39.0 markdown-link-check@3.12.2

      - name: Lint markdown
        run: markdownlint README.md CONTRIBUTING.md

      - name: Check markdown links
        run: markdown-link-check README.md CONTRIBUTING.md

      - name: shellcheck install.sh
        run: shellcheck install.sh

      - name: shfmt check install.sh
        run: shfmt -d install.sh

      - name: yamllint docker-compose and workflows
        run: yamllint docker-compose.yml .github/workflows/ci.yml

      - name: Validate docker compose config
        run: docker compose config >/tmp/compose-config.yaml

      - name: dotenv lint
        run: ~/.cargo/bin/dotenv-linter .env.example

      - name: Verify .env.example covers referenced variables
        run: |
          python3 - <<'PY'
          import pathlib
          import re

          env_file = pathlib.Path('.env.example').read_text().splitlines()
          compose_file = pathlib.Path('docker-compose.yml').read_text()
          install_file = pathlib.Path('install.sh').read_text()

          env_keys = {
              m.group(1)
              for line in env_file
              if (m := re.match(r'^\s*#?\s*([A-Za-z_][A-Za-z0-9_]*)\s*=.*$', line))
          }

          compose_vars = set(re.findall(r'\$\{([A-Za-z_][A-Za-z0-9_]*)', compose_file))
          install_defaults = set(
              re.findall(r'^:\s+"\$\{([A-Za-z_][A-Za-z0-9_]*)[:=]', install_file, flags=re.M)
          )

          referenced = compose_vars | install_defaults
          missing = sorted(v for v in referenced - env_keys)

          if missing:
              raise SystemExit(
                  'Variables referenced in compose/install but missing in .env.example: '
                  + ', '.join(missing)
              )

          print('All referenced environment variables are documented in .env.example')
          PY

  installer-smoke:
    runs-on: ubuntu-latest
    needs: docs-and-lint
    timeout-minutes: 25
    env:
      GPU_COUNT: '0'
      OLLAMA_MODEL: llama3.2:1b
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run installer
        run: ./install.sh

      - name: Verify services are healthy
        run: |
          docker compose ps
          docker compose logs --tail=100 ollama

      - name: Idempotency rerun
        run: ./install.sh

      - name: Cleanup
        if: always()
        run: docker compose down -v
