services:
  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-latest}
    # Remove container_name to avoid collisions when deploying multiple stacks
    restart: unless-stopped
    ports:
      - "${OLLAMA_BIND_ADDRESS:-127.0.0.1}:${PORT:-11434}:11434"
    environment:
      # Always listen on all interfaces inside the container
      OLLAMA_HOST: 0.0.0.0
      OLLAMA_KEEP_ALIVE: 24h
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "sh", "-c", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5

  model-init:
    image: ollama/ollama:${OLLAMA_VERSION:-latest}
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      # Use the internal service name to communicate with the ollama service
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        # Wait for the API to be reachable before pulling the model
        until ollama list >/dev/null 2>&1; do
          echo "Waiting for Ollama API..."
          sleep 2
        done
        ollama pull "$OLLAMA_MODEL"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  ollama-data: