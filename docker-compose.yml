services:
  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${PORT:-11434}:11434"
    environment:
      # Bind the Ollama API inside container. Keep this at 0.0.0.0 so other
      # services (like model-init) can always reach Ollama over service DNS.
      OLLAMA_HOST: ${OLLAMA_HOST:-0.0.0.0:11434}
      OLLAMA_KEEP_ALIVE: 24h
      NVIDIA_VISIBLE_DEVICES: ${GPU_DEVICE_IDS:-all}
    volumes:
      - ollama-data:/root/.ollama
    # Compose-native GPU request (widely supported by modern docker compose).
    gpus: ${GPU_COUNT:-all}
    # Compatibility fallback for engines that still rely on deploy.device reservations.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-all}
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "sh", "-c", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5

  model-init:
    image: ollama/ollama:${OLLAMA_VERSION:-latest}
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        until ollama list >/dev/null 2>&1; do
          echo "Waiting for Ollama API..."
          sleep 2
        done
        ollama pull "$OLLAMA_MODEL"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  ollama-data:
